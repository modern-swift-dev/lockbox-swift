name: CI

on:
  push:
  pull_request:

jobs:
  apple:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            destination: platform=macOS
          - platform: iOS
            destination: platform=iOS Simulator,name=iPhone 17 Pro,OS=latest
          - platform: tvOS
            destination: platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=latest
          - platform: visionOS
            destination: platform=visionOS Simulator,name=CI Apple Vision Pro,OS=26.4
          - platform: watchOS
            destination: platform=watchOS Simulator,name=Apple Watch Series 11 (46mm),OS=latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 26.4.1 and Swift 6.3
        run: |
          xcodebuild -version | grep -F 'Xcode 26.4.1'
          swift --version | grep -F 'Swift version 6.3'
      - name: Create visionOS simulator
        if: matrix.platform == 'visionOS'
        run: >-
          xcrun simctl create 'CI Apple Vision Pro'
          'com.apple.CoreSimulator.SimDeviceType.Apple-Vision-Pro-4K'
          'com.apple.CoreSimulator.SimRuntime.xrOS-26-4'
      - name: Test on ${{ matrix.platform }}
        run: xcodebuild test -scheme Lockbox -destination '${{ matrix.destination }}'
