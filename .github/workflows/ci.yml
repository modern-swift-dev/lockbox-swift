name: CI

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: blacksmith-6vcpu-macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift 6.3
        run: swift --version | grep -F 'Swift version 6.3'
      - name: Install lint tools
        run: |
          brew install mint actionlint
          mint bootstrap
      - name: Lint
        run: make lint

  apple:
    runs-on: blacksmith-6vcpu-macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            destination: platform=macOS
          - platform: iOS
            destination: simulator
            device_type: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
            runtime: com.apple.CoreSimulator.SimRuntime.iOS-26-5
          - platform: tvOS
            destination: simulator
            device_type: com.apple.CoreSimulator.SimDeviceType.Apple-TV-4K-3rd-generation-4K
            runtime: com.apple.CoreSimulator.SimRuntime.tvOS-26-5
          - platform: visionOS
            destination: simulator
            device_type: com.apple.CoreSimulator.SimDeviceType.Apple-Vision-Pro-4K
            runtime: com.apple.CoreSimulator.SimRuntime.xrOS-26-5
          - platform: watchOS
            destination: simulator
            device_type: com.apple.CoreSimulator.SimDeviceType.Apple-Watch-Series-11-46mm
            runtime: com.apple.CoreSimulator.SimRuntime.watchOS-26-5
    steps:
      - uses: actions/checkout@v4
      - name: Install xcbeautify
        run: |
          brew install mint
          mint install cpisciotta/xcbeautify
      - name: Verify Xcode 26.6 and Swift 6.3
        run: |
          xcodebuild -version | grep -F 'Xcode 26.6' 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
          swift --version | grep -F 'Swift version 6.3'
      - name: Select test destination
        id: destination
        env:
          DESTINATION: ${{ matrix.destination }}
          DEVICE_TYPE: ${{ matrix.device_type }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          if [[ "$DESTINATION" == "simulator" ]]; then
            simulator_id="$(xcrun simctl create 'Lockbox CI' "$DEVICE_TYPE" "$RUNTIME")"
            echo "value=id=$simulator_id" >> "$GITHUB_OUTPUT"
          else
            echo "value=$DESTINATION" >> "$GITHUB_OUTPUT"
          fi
      - name: Build for ${{ matrix.platform }}
        run: xcodebuild build -scheme Lockbox -destination '${{ steps.destination.outputs.value }}' 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
      - name: Test on ${{ matrix.platform }}
        run: xcodebuild test -scheme Lockbox -destination '${{ steps.destination.outputs.value }}' 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
