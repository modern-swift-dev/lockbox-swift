name: CI

on:
  push:
  pull_request:

jobs:
  apple:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            destination: platform=macOS
          - platform: iOS
            destination: simulator
            device_type: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
            runtime: com.apple.CoreSimulator.SimRuntime.iOS-26-4
          - platform: tvOS
            destination: simulator
            device_type: com.apple.CoreSimulator.SimDeviceType.Apple-TV-4K-3rd-generation-4K
            runtime: com.apple.CoreSimulator.SimRuntime.tvOS-26-4
          - platform: visionOS
            destination: simulator
            device_type: com.apple.CoreSimulator.SimDeviceType.Apple-Vision-Pro-4K
            runtime: com.apple.CoreSimulator.SimRuntime.xrOS-26-4
          - platform: watchOS
            destination: simulator
            device_type: com.apple.CoreSimulator.SimDeviceType.Apple-Watch-Series-11-46mm
            runtime: com.apple.CoreSimulator.SimRuntime.watchOS-26-4
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 26.4.1 and Swift 6.3
        run: |
          xcodebuild -version | grep -F 'Xcode 26.4.1'
          swift --version | grep -F 'Swift version 6.3'
      - name: Select test destination
        id: destination
        env:
          DESTINATION: ${{ matrix.destination }}
          DEVICE_TYPE: ${{ matrix.device_type }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          if [[ "$DESTINATION" == "simulator" ]]; then
            simulator_id="$(xcrun simctl create 'Lockbox CI' "$DEVICE_TYPE" "$RUNTIME")"
            echo "value=id=$simulator_id" >> "$GITHUB_OUTPUT"
          else
            echo "value=$DESTINATION" >> "$GITHUB_OUTPUT"
          fi
      - name: Test on ${{ matrix.platform }}
        run: xcodebuild test -scheme Lockbox -destination '${{ steps.destination.outputs.value }}'
